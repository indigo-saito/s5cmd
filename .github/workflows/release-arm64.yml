name: release-arm64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build arm64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.22'

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Build arm64 binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --abbrev=0 --tags 2>/dev/null || echo "unknown")
          BUILD=$(git rev-parse --short HEAD)
          go build -ldflags "-X=github.com/peak/s5cmd/v2/version.Version=${VERSION} -X=github.com/peak/s5cmd/v2/version.GitCommit=${BUILD}" -mod=vendor -o s5cmd-${VERSION}-linux-arm64 .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            s5cmd-*-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
